[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "krylov-qpe-spin-qubits"
version = "0.1.0"
description = "Quantum Krylov and statistical phase estimation for H2 under silicon spin-qubit noise (SpinPulse simulation)"
authors = [{ name = "Amalia Tsitsekli" }]
requires-python = ">=3.11"
dependencies = [
    "spin-pulse==1.1.3",
    "qiskit==2.6.0",
    "qiskit-aer==0.17.2",
    "openfermion==1.8.1",
    "openfermionpyscf==0.5",
    "pyscf==2.14.0",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "joblib==1.6.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "nbformat", "nbclient", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
